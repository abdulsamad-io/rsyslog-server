# 22-rulesets-compute.conf
# Rulesets for physical compute servers: Dell (iDRAC) and HP (iLO).
#
# Each ruleset:
#   1. Tags the message with _device_category and _device_type for Graylog.
#   2. Writes the normalised line to the local log file.
#   3. Forwards a GELF copy to Graylog via the shared rs_gelf_forward ruleset.

ruleset(name="rs_dell") {
    set $!device_category = "compute";
    set $!device_type     = "dell";
    action(type="omfile"
           dynaFile="tpl_dell"
           template="StandardLogFormat"
           createDirs="on"
           dirCreateMode="0750"
           fileCreateMode="0640")
    call rs_gelf_forward
    stop
}

ruleset(name="rs_hp") {
    set $!device_category = "compute";
    set $!device_type     = "hp";
    action(type="omfile"
           dynaFile="tpl_hp"
           template="StandardLogFormat"
           createDirs="on"
           dirCreateMode="0750"
           fileCreateMode="0640")
    call rs_gelf_forward
    stop
}
