# 22-rulesets-compute.conf
# Rulesets for physical compute servers: Dell (iDRAC) and HP (iLO).

ruleset(name="rs_dell") {
    action(type="omfile"
           dynaFile="tpl_dell"
           template="StandardLogFormat"
           createDirs="on"
           dirCreateMode="0750"
           fileCreateMode="0640")
    stop
}

ruleset(name="rs_hp") {
    action(type="omfile"
           dynaFile="tpl_hp"
           template="StandardLogFormat"
           createDirs="on"
           dirCreateMode="0750"
           fileCreateMode="0640")
    stop
}
