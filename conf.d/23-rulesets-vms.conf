# 23-rulesets-vms.conf
# Rulesets for virtual machines (Linux, Windows) and the catch-all unknown bucket.

ruleset(name="rs_vm_linux") {
    action(type="omfile"
           dynaFile="tpl_vm_linux"
           template="StandardLogFormat"
           createDirs="on"
           dirCreateMode="0750"
           fileCreateMode="0640")
    stop
}

ruleset(name="rs_vm_windows") {
    action(type="omfile"
           dynaFile="tpl_vm_windows"
           template="StandardLogFormat"
           createDirs="on"
           dirCreateMode="0750"
           fileCreateMode="0640")
    stop
}

ruleset(name="rs_unknown") {
    action(type="omfile"
           dynaFile="tpl_unknown"
           template="StandardLogFormat"
           createDirs="on"
           dirCreateMode="0750"
           fileCreateMode="0640")
    stop
}
