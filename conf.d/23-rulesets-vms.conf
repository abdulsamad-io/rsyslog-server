# 23-rulesets-vms.conf
# Rulesets for virtual machines (Linux, Windows) and the catch-all unknown bucket.
#
# Each ruleset:
#   1. Tags the message with _device_category and _device_type for Graylog.
#   2. Writes the normalised line to the local log file.
#   3. Forwards a GELF copy to Graylog via the shared rs_gelf_forward ruleset.

ruleset(name="rs_vm_linux") {
    set $!device_category = "vms";
    set $!device_type     = "linux";
    action(type="omfile"
           dynaFile="tpl_vm_linux"
           template="StandardLogFormat"
           createDirs="on"
           dirCreateMode="0750"
           fileCreateMode="0640")
    call rs_gelf_forward
    stop
}

ruleset(name="rs_vm_windows") {
    set $!device_category = "vms";
    set $!device_type     = "windows";
    action(type="omfile"
           dynaFile="tpl_vm_windows"
           template="StandardLogFormat"
           createDirs="on"
           dirCreateMode="0750"
           fileCreateMode="0640")
    call rs_gelf_forward
    stop
}

ruleset(name="rs_unknown") {
    set $!device_category = "unknown";
    set $!device_type     = "unknown";
    action(type="omfile"
           dynaFile="tpl_unknown"
           template="StandardLogFormat"
           createDirs="on"
           dirCreateMode="0750"
           fileCreateMode="0640")
    call rs_gelf_forward
    stop
}
