# 10-templates.conf
# Defines:
#   1. StandardLogFormat — a single, normalised output format applied to
#      every log entry regardless of source device type.
#   2. DynaFile path templates — one per device category/type, all pointing
#      to <hostname>_current.log inside a per-device sub-directory.
#
# Log file naming:
#   Active (today):  /var/log/<category>/<type>/<hostname>/<hostname>_current.log
#   Rotated:         /var/log/<category>/<type>/<hostname>/<hostname>_YYYY-MM-DD.log.gz
#
# The rename from *_current_YYYY-MM-DD.log → *_YYYY-MM-DD.log is handled
# by the postrotate hook in logrotate/network-logs.

# ── Unified output format ─────────────────────────────────────────────────────
# Every line written to disk follows this layout:
#   2026-04-12T14:30:00+01:00 HOSTNAME facility.severity PROGRAM: message
#
# Using type="list" so hostname/tag use securepath="replace", preventing
# path-traversal characters from leaking into the message body.
#
# NOTE: $msg is output without spifno1stsp so that messages which do NOT
# start with a space are preserved. Cisco ASA and similar devices send
# messages beginning with '%ASA-' (no leading space); spifno1stsp="on"
# would silently suppress the entire message body for those devices.
template(name="StandardLogFormat" type="list") {
    property(name="timereported"       dateFormat="rfc3339")
    constant(value=" ")
    property(name="hostname"           securepath="replace")
    constant(value=" ")
    property(name="syslogfacility-text")
    constant(value=".")
    property(name="syslogseverity-text")
    constant(value=" ")
    property(name="syslogtag"          securepath="replace")
    property(name="msg")
    constant(value="\n")
}

# ── Network — Routers & Switches ──────────────────────────────────────────────

template(name="tpl_cisco_ios" type="list") {
    constant(value="/var/log/network/cisco-ios/")
    property(name="hostname" securepath="replace")
    constant(value="/")
    property(name="hostname" securepath="replace")
    constant(value="_current.log")
}

