# 30-routing.conf
# Opens UDP/TCP port 514 and routes every incoming syslog message to the
# correct device ruleset based on message content.
#
# Detection order (most-specific → least-specific):
#   1.  Cisco ASA / FWSM   — %ASA- / %FWSM- in message
#   2.  Cisco FTD           — %FTD- / SFIMS in message or program name
#   3.  FortiGate           — key=value CEF: devname= AND logid= present
#   4.  Cisco NX-OS         — NX-OS-specific facility names (%VPC-, %EVPN-, …)
#   5.  Cisco IOS XR        — RP/0/ control-plane prefix or %PKT_INFRA-
#   6.  Arista EOS          — %EOS- facility or "Eos" in tag/program
#   7.  MikroTik RouterBoard — RouterOS in program name or message
#   8.  Dell (iDRAC)        — iDRAC in tag, program, or message
#   9.  HP (iLO)            — iLO in tag, program, or message
#   10. Windows VM          — MSWinEventLog / WinEvent tag
#   11. Cisco IOS XE        — explicit "Cisco IOS XE" string or ios_xe program
#   12. Cisco IOS           — generic %FAC-SEV-MNE: syslog format
#   13. Linux VM            — standard POSIX syslog facilities
#   14. Unknown             — catch-all
#
# RECOMMENDED: Add IP-based overrides at the top of rs_routing for every
# known device — they are 100 % accurate and skip all pattern matching.

# ── Inputs ────────────────────────────────────────────────────────────────────

input(type="imudp" port="514" ruleset="rs_routing")
input(type="imtcp" port="514" ruleset="rs_routing")

# ── Main routing ruleset ──────────────────────────────────────────────────────

ruleset(name="rs_routing") {

    # ── IP-BASED OVERRIDES ────────────────────────────────────────────────────
    # Uncomment and populate with your actual device management IPs.
    # Source-IP matching is always more reliable than content matching.
    #
    # Firewall
    # if $fromhost-ip == "10.0.0.1"  then { call rs_cisco_asa    stop }
    # if $fromhost-ip == "10.0.0.2"  then { call rs_cisco_ftd    stop }
    # if $fromhost-ip == "10.0.0.3"  then { call rs_fortigate    stop }
    #
    # Network — routers / switches
    # if $fromhost-ip == "10.0.1.1"  then { call rs_cisco_ios    stop }
    # if $fromhost-ip == "10.0.1.2"  then { call rs_cisco_ios_xe stop }
    # if $fromhost-ip == "10.0.1.3"  then { call rs_cisco_ios_xr stop }
    # if $fromhost-ip == "10.0.1.4"  then { call rs_cisco_nxos   stop }
    # if $fromhost-ip == "10.0.1.5"  then { call rs_arista_eos   stop }
    # if $fromhost-ip == "10.0.1.6"  then { call rs_mikrotik     stop }
    #
    # Compute
    # if $fromhost-ip == "10.0.2.1"  then { call rs_dell         stop }
    # if $fromhost-ip == "10.0.2.2"  then { call rs_hp           stop }
    #
    # VMs
    # if $fromhost-ip == "10.0.3.10" then { call rs_vm_linux     stop }
    # if $fromhost-ip == "10.0.3.20" then { call rs_vm_windows   stop }

    # ── 1. Cisco ASA / FWSM ──────────────────────────────────────────────────
    if ($msg contains "%ASA-" or
        $msg contains "%FWSM-" or
        $programname contains "ASA") then {
        call rs_cisco_asa
        stop
    }

    # ── 2. Cisco FTD ─────────────────────────────────────────────────────────
    if ($msg contains "%FTD-" or
        $msg contains "SFIMS" or
        $programname contains "sfims") then {
        call rs_cisco_ftd
        stop
    }

    # ── 3. FortiGate — key=value CEF format ──────────────────────────────────
    if ($msg contains "devname=" and
        $msg contains "logid=") then {
        call rs_fortigate
        stop
    }

    # ── 4. Cisco NX-OS ───────────────────────────────────────────────────────
    if ($msg contains "%ETH_PORT_CHANNEL" or
        $msg contains "%VPC-" or
        $msg contains "%PLATFORM-" or
        $msg contains "%URIB-" or
        $msg contains "%EVPN-" or
        $msg contains "%NXOS") then {
        call rs_cisco_nxos
        stop
    }

    # ── 5. Cisco IOS XR ──────────────────────────────────────────────────────
    if ($msg contains "RP/0/" or
        $msg contains "%PKT_INFRA-" or
        $msg contains "ios_xr") then {
        call rs_cisco_ios_xr
        stop
    }

    # ── 6. Arista EOS ────────────────────────────────────────────────────────
    if ($msg contains "%EOS-" or
        $programname contains "Eos" or
        $syslogtag contains "Eos") then {
        call rs_arista_eos
        stop
    }

    # ── 7. MikroTik RouterBoard ───────────────────────────────────────────────
    if ($programname contains "RouterOS" or
        $programname contains "mikrotik" or
        $msg contains "RouterOS") then {
        call rs_mikrotik
        stop
    }

    # ── 8. Dell iDRAC ────────────────────────────────────────────────────────
    if ($msg contains "iDRAC" or
        $msg contains "idrac" or
        $syslogtag contains "iDRAC" or
        $programname contains "idrac" or
        $msg contains "Dell Inc") then {
        call rs_dell
        stop
    }

    # ── 9. HP iLO ────────────────────────────────────────────────────────────
    if ($msg contains "iLO" or
        $msg contains "HP iLO" or
        $syslogtag contains "iLO" or
        $programname contains "ilo" or
        $msg contains "Hewlett Packard") then {
        call rs_hp
        stop
    }

    # ── 10. Windows VM ────────────────────────────────────────────────────────
    if ($syslogtag contains "MSWinEventLog" or
        $msg contains "MSWinEventLog" or
        $programname contains "Microsoft-Windows" or
        $syslogtag contains "WinEvent") then {
        call rs_vm_windows
        stop
    }

    # ── 11. Cisco IOS XE — explicit identifier ────────────────────────────────
    if ($msg contains "Cisco IOS XE" or
        $programname contains "ios_xe") then {
        call rs_cisco_ios_xe
        stop
    }

    # ── 12. Cisco IOS — generic %FACILITY-SEVERITY-MNEMONIC: format ──────────
    if ($msg contains "%SYS-" or
        $msg contains "%LINK-" or
        $msg contains "%LINEPROTO-" or
        $msg contains "%OSPF" or
        $msg contains "%BGP-" or
        $msg contains "%CDP-" or
        $msg contains "%EIGRP-" or
        $msg contains "%SPANNING_TREE" or
        $msg contains "%HSRP-" or
        $msg contains "%SEC-6-IPACCESSLOG" or
        $msg contains "%DHCP-" or
        $msg contains "%DOT1X-" or
        $msg contains "%SNMP-") then {
        call rs_cisco_ios
        stop
    }

    # ── 13. Linux VM — standard POSIX syslog facilities ──────────────────────
    if ($syslogfacility-text == "kern" or
        $syslogfacility-text == "user" or
        $syslogfacility-text == "daemon" or
        $syslogfacility-text == "auth" or
        $syslogfacility-text == "authpriv" or
        $syslogfacility-text == "cron" or
        $syslogfacility-text == "mail") then {
        call rs_vm_linux
        stop
    }

    # ── 14. Unknown / catch-all ───────────────────────────────────────────────
    call rs_unknown
    stop
}
