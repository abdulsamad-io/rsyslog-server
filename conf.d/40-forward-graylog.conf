# 40-forward-graylog.conf
#
# Forwards every syslog message to Graylog via GELF (Graylog Extended Log
# Format) over UDP port 12201.
#
# HOW IT WORKS
# ─────────────
# Each device ruleset (20-23-rulesets-*.conf) now does three things:
#   1. Sets $!device_category and $!device_type as structured-data fields.
#   2. Writes the normalised line to the local log file (unchanged behaviour).
#   3. Calls rs_gelf_forward (this ruleset) to ship a GELF copy to Graylog.
#
# The $!device_category / $!device_type variables are automatically included
# by omgelf as additional GELF fields (_device_category, _device_type),
# making them directly filterable in Graylog Streams and dashboards without
# any Graylog-side parsing work.
#
# SETUP REQUIRED
# ──────────────
# 1. Replace GRAYLOG_SERVER_IP below with the IP of your Graylog host.
# 2. Copy this file to /etc/rsyslog.d/40-forward-graylog.conf on the server.
# 3. Validate: sudo rsyslogd -N1
# 4. Restart:  sudo systemctl restart rsyslog
# 5. In Graylog UI: Inputs → Launch new input → GELF UDP → port 12201.
#
# WHAT EACH GELF MESSAGE CONTAINS
# ────────────────────────────────
#   host             ← device hostname (from syslog HOSTNAME field)
#   short_message    ← syslogtag + message body
#   full_message     ← complete normalised line (same as written to file)
#   timestamp        ← device timestamp (RFC 3339, from timereported)
#   level            ← syslog severity (numeric)
#   _facility        ← syslog facility text  (e.g. local6)
#   _device_category ← firewall | network | compute | vms | unknown
#   _device_type     ← cisco-asa | cisco-ios | fortigate | dell | … etc.

module(load="omgelf")

# ── GELF message templates ────────────────────────────────────────────────────

# short_message: tag + message body (no timestamp/host — those are in the
# GELF envelope and would be redundant here)
template(name="GELFShortMessage" type="list") {
    property(name="syslogtag"  securepath="replace")
    property(name="msg")
}

# full_message: the complete normalised line exactly as written to disk,
# useful as a raw reference inside Graylog
template(name="GELFFullMessage" type="list") {
    property(name="timereported"        dateFormat="rfc3339")
    constant(value=" ")
    property(name="hostname"            securepath="replace")
    constant(value=" ")
    property(name="syslogfacility-text")
    constant(value=".")
    property(name="syslogseverity-text")
    constant(value=" ")
    property(name="syslogtag"           securepath="replace")
    property(name="msg")
}

# ── Shared GELF forwarding ruleset ────────────────────────────────────────────
# Called by every device ruleset after the local file write.
# $!device_category and $!device_type are set by the calling ruleset and
# are automatically included in the GELF payload as additional fields.

ruleset(name="rs_gelf_forward") {
    action(
        type="omgelf"
        server="GRAYLOG_SERVER_IP"      # ← replace with your Graylog IP
        port="12201"
        compress="true"
        shortmessage="GELFShortMessage"
        fullmessage="GELFFullMessage"

        # Disk-backed queue: spools messages when Graylog is unreachable
        # (common in home/lab environments where services restart independently)
        queue.type="LinkedList"
        queue.filename="gelf-fwd-queue"
        queue.maxdiskspace="512m"
        queue.saveonshutdown="on"
        action.resumeRetryCount="-1"
    )
}
