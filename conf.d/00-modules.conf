# 00-modules.conf
# Load input modules required for remote syslog collection.
# module() is idempotent — safe even if imudp/imtcp are already loaded
# by the system's /etc/rsyslog.conf.

# UDP — standard syslog (fire-and-forget, low overhead)
module(load="imudp")

# TCP — reliable / ordered delivery
module(load="imtcp")
