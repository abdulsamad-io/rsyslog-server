# 20-rulesets-network.conf
# Rulesets for network devices: routers and switches.
# Each ruleset writes using StandardLogFormat to its dedicated path template
# and then stops further processing.

ruleset(name="rs_cisco_ios") {
    action(type="omfile"
           dynaFile="tpl_cisco_ios"
           template="StandardLogFormat"
           createDirs="on"
           dirCreateMode="0750"
           fileCreateMode="0640")
    stop
}

