# 20-rulesets-network.conf
# Rulesets for network devices: routers and switches.
#
# Each ruleset:
#   1. Tags the message with _device_category and _device_type for Graylog.
#   2. Writes the normalised line to the local log file.
#   3. Forwards a GELF copy to Graylog via the shared rs_gelf_forward ruleset.

ruleset(name="rs_cisco_ios") {
    set $!device_category = "network";
    set $!device_type     = "cisco-ios";
    action(type="omfile"
           dynaFile="tpl_cisco_ios"
           template="StandardLogFormat"
           createDirs="on"
           dirCreateMode="0750"
           fileCreateMode="0640")
    call rs_gelf_forward
    stop
}

